<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Safety Console</title>
<meta name="theme-color" content="#0a0d12">
<script>try{if(localStorage.getItem("sc_lang")==="ar"){document.documentElement.lang="ar";document.documentElement.dir="rtl"}}catch(e){}</script>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&family=Sora:wght@500;600;700&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap">
<style>
:root{color-scheme:dark;--bg:#0a0d12;--ink:#e8edf4;--mut:#8b97a8;--line:rgba(255,255,255,.085);--line2:rgba(255,255,255,.15);--pri:#5cc8ff;--crit:#ff5a5f;--high:#ff8a3d;--med:#f0b429;--low:#3ddc97;--ok:#3ddc97;--r:18px;
--fd:'Sora',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;--fb:'Manrope',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{background:#0a0d12}
body{margin:0;font:15px/1.5 var(--fb);color:var(--ink);min-height:100vh;padding-bottom:108px;
 background:radial-gradient(1100px 620px at 92% -16%,rgba(92,200,255,.14),transparent 60%),radial-gradient(820px 620px at -16% 108%,rgba(125,100,255,.10),transparent 60%),linear-gradient(180deg,#0c1016,#07090d);background-attachment:fixed}
body::before{content:"";position:fixed;inset:0;pointer-events:none;z-index:0;background:repeating-linear-gradient(90deg,rgba(255,255,255,.024) 0 1px,transparent 1px 4px);-webkit-mask-image:linear-gradient(180deg,#000,transparent 70%);mask-image:linear-gradient(180deg,#000,transparent 70%)}
#app,#modal{position:relative;z-index:1}
a{color:var(--pri)}
/* header */
header{position:sticky;top:0;z-index:20;display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 16px;background:linear-gradient(180deg,rgba(26,33,44,.86),rgba(13,17,23,.78));border-bottom:1px solid var(--line);box-shadow:inset 0 1px 0 rgba(255,255,255,.07),0 10px 28px rgba(0,0,0,.4)}
@supports (backdrop-filter:blur(1px)){header{backdrop-filter:blur(16px) saturate(1.3);-webkit-backdrop-filter:blur(16px) saturate(1.3)}}
.brand{display:flex;align-items:center;gap:11px;min-width:0}.brand svg{flex:none;filter:drop-shadow(0 0 8px rgba(92,200,255,.5))}
.brand b{font:600 15px var(--fd);letter-spacing:.01em;display:block;white-space:nowrap}
.brand small{display:block;color:var(--mut);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:48vw}
.sync{font-size:12px;color:var(--mut);display:flex;align-items:center;gap:6px;white-space:nowrap}
.sync::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--mut)}
.sync.ok::before{background:var(--low);box-shadow:0 0 10px var(--low)}.sync.busy::before{background:var(--pri);box-shadow:0 0 10px var(--pri);animation:pulse 1s infinite}.sync.err::before{background:var(--crit);box-shadow:0 0 10px var(--crit)}
main{padding:18px 16px;max-width:1160px;margin:0 auto}
h2{font:600 24px/1.2 var(--fd);letter-spacing:-.015em;margin:4px 0 16px}
h3{font:600 13px var(--fb);letter-spacing:.015em;color:var(--mut);margin:0 0 10px}
/* glass cards */
.card{background:linear-gradient(180deg,rgba(255,255,255,.07),rgba(255,255,255,.028));border:1px solid var(--line);border-radius:var(--r);padding:16px;margin-bottom:12px;box-shadow:inset 0 1px 0 rgba(255,255,255,.08),0 14px 34px -14px rgba(0,0,0,.7)}
@supports (backdrop-filter:blur(1px)){.card{backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}}
label{display:block;font-size:12.5px;color:var(--mut);margin:13px 0 5px;font-weight:600}
input,select,textarea{width:100%;padding:12px 13px;border:1px solid var(--line2);border-radius:12px;font:inherit;color:var(--ink);background:rgba(7,10,15,.6);transition:border-color .15s,box-shadow .15s}
input:focus,select:focus,textarea:focus{outline:none;border-color:rgba(92,200,255,.75);box-shadow:0 0 0 3px rgba(92,200,255,.18)}
input::placeholder,textarea::placeholder{color:#5b6677}textarea{min-height:88px;resize:vertical}select option{background:#151b24;color:var(--ink)}
input[type=checkbox]{width:auto}fieldset{border:0;padding:0;margin:0;min-width:0}fieldset:disabled{opacity:.72}
/* buttons: brushed metal with a cool glass tint */
button,.btn{position:relative;overflow:hidden;display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:10px 16px;border:1px solid rgba(255,255,255,.38);border-radius:12px;font:600 14px var(--fb);cursor:pointer;color:#05141d;text-decoration:none;background:linear-gradient(180deg,#b4e7ff 0%,#5cc8ff 46%,#2c9fdc 100%);box-shadow:inset 0 1px 0 rgba(255,255,255,.75),0 8px 20px -8px rgba(92,200,255,.6);transition:transform .12s,filter .2s,box-shadow .2s}
button::after,.btn::after{content:"";position:absolute;top:0;left:-70%;width:40%;height:100%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.5),transparent);transform:skewX(-20deg);transition:left .6s ease;pointer-events:none}
@media (hover:hover){button:hover:not(:disabled)::after,.btn:hover::after{left:140%}button:hover:not(:disabled),.btn:hover{filter:brightness(1.07)}}
button:active:not(:disabled){transform:translateY(1px) scale(.992)}
button.sec{color:var(--ink);background:linear-gradient(180deg,rgba(255,255,255,.13),rgba(255,255,255,.05));border-color:var(--line2);box-shadow:inset 0 1px 0 rgba(255,255,255,.14)}
button.dan,button.critical{color:#fff;background:linear-gradient(180deg,#ff8e92,#e5383b 54%,#b3262a);border-color:rgba(255,255,255,.32);box-shadow:inset 0 1px 0 rgba(255,255,255,.4),0 8px 20px -8px rgba(255,90,95,.65)}
button.high{color:#1d0c00;background:linear-gradient(180deg,#ffc08f,#ff8a3d 55%,#d9631a)}button.medium{color:#1f1600;background:linear-gradient(180deg,#ffe08a,#f0b429 55%,#c18a0c)}button.low{color:#04170d;background:linear-gradient(180deg,#a6f2cf,#3ddc97 55%,#22a874)}
button.sm{min-height:36px;padding:5px 13px;font-size:13px;border-radius:10px}button:disabled{opacity:.45;cursor:not-allowed}
:focus-visible{outline:2px solid #9fe0ff;outline-offset:2px}
.row{display:flex;gap:8px;flex-wrap:wrap}.row>*{flex:1;min-width:130px}
.mut{color:var(--mut);font-size:12.5px}.scroll{overflow-x:auto}
/* badges */
.badge{display:inline-flex;align-items:center;padding:3px 10px;border-radius:99px;font-size:11px;font-weight:700;color:#fff;letter-spacing:.02em;border:1px solid rgba(255,255,255,.28);white-space:nowrap}
.critical{background:linear-gradient(180deg,#ff7a7e,#d92f34)}.high{background:linear-gradient(180deg,#ff9d5c,#e0701f)}.medium{background:linear-gradient(180deg,#f6c94f,#c18a0c)}.low{background:linear-gradient(180deg,#58e2a6,#22a874)}.gray{background:linear-gradient(180deg,#7d8998,#566171)}
.badge.medium,.badge.low,.badge.high{color:#10130f}
.badge.critical{box-shadow:0 0 14px rgba(255,90,95,.55)}
/* alerts */
.alert{background:linear-gradient(180deg,rgba(255,90,95,.22),rgba(255,90,95,.1));border:1px solid rgba(255,90,95,.62);color:#ffe4e5;border-radius:14px;padding:14px;margin:10px 0;font-weight:600;box-shadow:0 0 34px -10px rgba(255,90,95,.6)}
.alert a{color:#fff}
.warn{background:rgba(240,180,41,.1);border:1px solid rgba(240,180,41,.42);color:#ffe9b0;border-radius:14px;padding:12px;margin:10px 0;font-size:13.5px}
.info{background:rgba(92,200,255,.09);border:1px solid rgba(92,200,255,.34);color:#cfeeff;border-radius:14px;padding:12px;margin:10px 0;font-size:13.5px}
/* category tiles */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(106px,1fr));gap:9px}
.cat{border:1px solid var(--line2);border-radius:14px;padding:12px 6px;text-align:center;background:linear-gradient(180deg,rgba(255,255,255,.07),rgba(255,255,255,.02));font-size:11.5px;font-weight:600;cursor:pointer;color:#cfd8e4;transition:border-color .15s,box-shadow .2s,transform .12s}
.cat i{display:block;font-size:26px;font-style:normal;margin-bottom:5px}
@media (hover:hover){.cat:hover{transform:translateY(-2px);border-color:rgba(255,255,255,.32)}}
.cat.on{border-color:rgba(92,200,255,.85);color:#e6f7ff;background:linear-gradient(180deg,rgba(92,200,255,.24),rgba(92,200,255,.06));box-shadow:0 0 24px -6px rgba(92,200,255,.65)}
/* KPIs and bars */
.kpi{display:grid;grid-template-columns:repeat(auto-fill,minmax(142px,1fr));gap:10px}
.kpi div{border-radius:16px;padding:14px;cursor:pointer;background:linear-gradient(180deg,rgba(255,255,255,.08),rgba(255,255,255,.024));border:1px solid var(--line);box-shadow:inset 0 1px 0 rgba(255,255,255,.1);transition:transform .15s,border-color .2s,box-shadow .2s}
@media (hover:hover){.kpi div:hover{transform:translateY(-2px);border-color:rgba(92,200,255,.5);box-shadow:inset 0 1px 0 rgba(255,255,255,.14),0 14px 30px -14px rgba(92,200,255,.55)}}
.kpi b{display:block;font:600 31px/1.1 var(--fd);font-variant-numeric:tabular-nums;background:linear-gradient(180deg,#fff,#93a3b8);-webkit-background-clip:text;background-clip:text;color:transparent}
.kpi small{color:var(--mut);font-size:12px}
.kpi .r{border-color:rgba(255,90,95,.5);box-shadow:inset 0 1px 0 rgba(255,255,255,.1),0 0 26px -8px rgba(255,90,95,.55)}.kpi .r b{background:linear-gradient(180deg,#ffd6d8,#ff5a5f);-webkit-background-clip:text;background-clip:text}
.bar{display:flex;align-items:center;gap:10px;margin:8px 0;font-size:13px}.bar span:first-child{width:44%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:#c3cdda}
.bar i{display:block;height:9px;border-radius:99px;min-width:4px;background:linear-gradient(90deg,#2c9fdc,#9be0ff);box-shadow:0 0 14px rgba(92,200,255,.45);transform-origin:left}
.bar em{font-style:normal;color:var(--mut);font-variant-numeric:tabular-nums}
#app.enter .bar i{animation:grow .85s cubic-bezier(.2,.8,.2,1) both}
.grid2{display:grid;grid-template-columns:1fr;gap:12px}.grid2 .card{margin-bottom:0}@media (min-width:900px){.grid2{grid-template-columns:1fr 1fr}}
/* lists, tables */
.item{padding:12px 8px;border-bottom:1px solid var(--line);cursor:pointer;border-radius:10px;transition:background .15s}.item:last-child{border:0}
@media (hover:hover){.item:hover{background:rgba(255,255,255,.045)}}
.hist{border-left:2px solid rgba(92,200,255,.5);padding-left:12px;margin:0 0 12px}
table{border-collapse:collapse;width:100%;font-size:12.5px}th,td{border:1px solid var(--line);padding:7px 8px;text-align:left;vertical-align:top}th{background:rgba(255,255,255,.055);color:#b9c4d3;font-weight:600}
details summary{cursor:pointer;font-weight:600;color:var(--pri);padding:8px 0;min-height:40px}
img.th{max-width:100%;max-height:220px;border-radius:12px;border:1px solid var(--line2)}
/* dock navigation */
nav{position:fixed;left:50%;bottom:calc(12px + env(safe-area-inset-bottom));transform:translateX(-50%);z-index:30;display:flex;gap:4px;padding:6px;width:min(94vw,470px);border-radius:24px;background:linear-gradient(180deg,rgba(38,47,60,.88),rgba(15,19,26,.92));border:1px solid var(--line2);box-shadow:inset 0 1px 0 rgba(255,255,255,.16),0 20px 44px rgba(0,0,0,.6)}
@supports (backdrop-filter:blur(1px)){nav{backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px)}}
nav button{flex:1;flex-direction:column;gap:3px;min-height:54px;padding:6px 2px;background:none;border:0;box-shadow:none;color:var(--mut);font-size:10.5px;font-weight:600;border-radius:17px;filter:none}
nav button::after{display:none}nav button svg{transition:transform .2s}
nav button.on{color:#dff4ff;background:linear-gradient(180deg,rgba(92,200,255,.24),rgba(92,200,255,.06));box-shadow:inset 0 0 0 1px rgba(92,200,255,.38),0 0 20px rgba(92,200,255,.2)}
nav button.cta{color:#05141d;background:linear-gradient(180deg,#b4e7ff,#3aaee8);box-shadow:inset 0 1px 0 rgba(255,255,255,.7),0 8px 22px -6px rgba(92,200,255,.7)}
@media (hover:hover){nav button:hover svg{transform:translateY(-2px)}}
@media (min-width:1000px){main{padding-left:108px}nav{left:18px;top:88px;bottom:auto;transform:none;width:74px;flex-direction:column;border-radius:24px}body{padding-bottom:30px}}
/* sheets */
#modal .ov{position:fixed;inset:0;background:rgba(3,6,10,.66);z-index:50;display:flex;align-items:flex-end;justify-content:center;animation:fade .2s both}
#modal .box{width:100%;max-width:640px;max-height:92vh;overflow:auto;border-radius:26px 26px 0 0;padding:22px 18px calc(22px + env(safe-area-inset-bottom));background:linear-gradient(180deg,#1c2430,#10141b);border:1px solid var(--line2);border-bottom:0;box-shadow:0 -24px 70px rgba(0,0,0,.65);animation:sheet .3s cubic-bezier(.2,.8,.2,1) both}
@media (min-width:700px){#modal .ov{align-items:center}#modal .box{border-radius:26px;border-bottom:1px solid var(--line2)}}
.toast{position:fixed;left:50%;bottom:104px;transform:translateX(-50%);z-index:60;padding:10px 18px;border-radius:99px;background:rgba(20,26,35,.95);border:1px solid rgba(92,200,255,.5);color:#dff4ff;font-weight:600;box-shadow:0 0 28px -6px rgba(92,200,255,.55);animation:sheet .3s both}
/* sign-in and splash */
.authwrap{min-height:100vh;display:grid;place-items:center;padding:22px}.authcard{width:min(100%,410px)}
.authcard .card{padding:26px 22px;text-align:left}.authcard h2{margin:14px 0 4px;text-align:center}.authcard .sub{text-align:center;color:var(--mut);font-size:13px;margin-bottom:6px}
.sentinel{width:132px;height:132px;margin:0 auto;filter:drop-shadow(0 0 22px rgba(92,200,255,.35))}.sentinel svg{width:100%;height:100%}
.sweep{transform-origin:60px 60px;animation:spin 7s linear infinite}
.splash{min-height:100vh;display:grid;place-content:center;justify-items:center;gap:14px;color:var(--mut);font-size:13px}
.metal{background:linear-gradient(180deg,#fff,#9aa8ba 60%,#6b788a);-webkit-background-clip:text;background-clip:text;color:transparent}
/* emergency codes */
.codegrid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}@media (min-width:700px){.codegrid{grid-template-columns:repeat(5,1fr)}}
button.codetile{flex-direction:column;align-items:flex-start;justify-content:flex-start;text-align:left;min-height:96px;padding:14px 12px 12px 18px;border-radius:16px;color:var(--ink);background:linear-gradient(180deg,rgba(255,255,255,.08),rgba(255,255,255,.02));border:1px solid var(--line2);box-shadow:inset 0 1px 0 rgba(255,255,255,.1);gap:3px}
button.codetile::before{content:"";position:absolute;left:0;top:0;bottom:0;width:7px;background:var(--cc)}button.codetile::after{display:none}
button.codetile b{font:600 15px var(--fd)}button.codetile span{font-size:11.5px;color:var(--mut);font-weight:500;line-height:1.3}
@media (hover:hover){button.codetile:hover{border-color:rgba(255,255,255,.35);box-shadow:inset 0 1px 0 rgba(255,255,255,.14),0 14px 30px -14px var(--cc)}}
.sq{display:inline-block;width:16px;height:16px;border-radius:5px;border:1px solid rgba(255,255,255,.42);vertical-align:-3px}.sq.lg{width:46px;height:46px;border-radius:13px;flex:none}.sq.sm{width:11px;height:11px;border-radius:3px;vertical-align:-1px}
.sqrow{display:flex;flex-wrap:wrap;gap:8px}
button.sqbtn{min-height:0;width:42px;height:42px;padding:0;border-radius:12px;background:var(--cc);border:2px solid rgba(255,255,255,.25);box-shadow:none}button.sqbtn::after{display:none}button.sqbtn.on{border-color:#fff;box-shadow:0 0 0 3px rgba(255,255,255,.22),0 0 22px -2px var(--cc)}
.codebar{display:flex;align-items:center;gap:14px;padding:14px 16px;border-radius:18px;margin-bottom:10px;border:1px solid color-mix(in srgb,var(--cc) 60%,transparent);background:linear-gradient(90deg,color-mix(in srgb,var(--cc) 26%,transparent),rgba(255,255,255,.03));box-shadow:0 0 34px -12px var(--cc)}
.codebar b{font:600 18px var(--fd)}.codebar .timer{margin-left:auto;text-align:right;font:600 19px var(--fd);font-variant-numeric:tabular-nums}.timer small{display:block;font:500 11.5px var(--fb);color:var(--mut)}
.stick{position:sticky;top:66px;z-index:15;display:flex;gap:8px;flex-wrap:wrap;padding:10px;margin:0 0 12px;border-radius:16px;background:rgba(13,17,24,.86);border:1px solid var(--line2);box-shadow:0 12px 30px -10px rgba(0,0,0,.7)}
@supports (backdrop-filter:blur(1px)){.stick{backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}}
.stick>*{flex:1;min-width:104px}.stick:empty{display:none}
.chips{display:flex;flex-wrap:wrap;gap:8px}
button.chip{min-height:42px;padding:8px 14px;border-radius:99px;font-size:13.5px;font-weight:600;text-align:left;color:#c9d3df;background:rgba(255,255,255,.055);border:1px solid var(--line2);box-shadow:none}
button.chip::after{display:none}
button.chip.on{color:#05141d;background:linear-gradient(180deg,#b4e7ff,#4db9f0);border-color:rgba(255,255,255,.55);box-shadow:0 0 18px -2px rgba(92,200,255,.6)}
.resp{display:grid;grid-template-columns:1.3fr 1fr .8fr;gap:8px;align-items:center;margin:7px 0}@media (max-width:640px){.resp{grid-template-columns:1fr 1fr}.resp button{grid-column:1/-1}}
.stamp{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:8px 12px;border-radius:12px;background:rgba(92,200,255,.08);border:1px solid rgba(92,200,255,.28);margin:6px 0}.stamp span{color:var(--mut);font-size:12.5px}.stamp b{flex:1;min-width:150px;font-size:13.5px}
.revs{display:grid;gap:8px}
.piewrap{display:flex;gap:18px;align-items:center;flex-wrap:wrap}.legend div{margin:5px 0;font-size:13px}.legend b{color:var(--mut);margin-left:4px}
.pie{width:132px;height:132px;border-radius:50%;-webkit-mask:radial-gradient(circle,transparent 36%,#000 38%);mask:radial-gradient(circle,transparent 36%,#000 38%);box-shadow:0 0 26px -6px rgba(92,200,255,.4)}
.vbars{display:flex;align-items:flex-end;gap:10px;min-height:150px}.vbars div{flex:1;text-align:center;font-size:11.5px;color:var(--mut);line-height:1.3}
.vbars i{display:block;width:100%;margin-bottom:5px;border-radius:9px 9px 3px 3px;background:linear-gradient(180deg,#9be0ff,#2c9fdc);box-shadow:0 0 16px rgba(92,200,255,.4)}
.dial svg{flex:none}
@keyframes grow{from{transform:scaleX(0)}}@keyframes fade{from{opacity:0}}@keyframes sheet{from{opacity:0;transform:translateY(14px)}}@keyframes spin{to{transform:rotate(360deg)}}@keyframes pulse{50%{opacity:.35}}
.badge.critical{animation:pulse 2.4s ease-in-out infinite}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important;scroll-behavior:auto!important}}
/* printing: light, plain, A4 */
#rep{display:none}
@page{size:A4;margin:14mm}
@media print{
 :root{color-scheme:light}html,body{background:#fff!important;color:#000!important;padding:0!important}body::before{display:none}
 header,nav,.noprint,button,.btn,#modal,.toast{display:none!important}
 .card{background:none!important;border:0!important;box-shadow:none!important;padding:0!important;backdrop-filter:none!important}
 main{padding:0!important;max-width:none}h2,h3,label,.mut,.bar span:first-child,.bar em,td,th{color:#000!important}th{background:#eee!important}th,td{border:1px solid #999!important}
 .kpi b{color:#000!important;-webkit-text-fill-color:#000;background:none!important}.kpi div{border:1px solid #999!important;background:none!important}
 .bar i{box-shadow:none!important;background:#555!important}
 body.printing-inc #app{display:none!important}body.printing-inc #rep{display:block!important}
 .badge{color:#000!important;background:none!important;border:1px solid #666!important;box-shadow:none!important;animation:none}
}

.actrow{display:flex;align-items:center;gap:12px;margin:8px 0}.actrow>span:not(.sq){flex:1;min-width:0}.actrow>button{flex:none;min-width:0;width:auto;padding:0 16px}.actrow .sq.lg{width:34px;height:34px}

/* ===== v3 visual layer ===== */
@property --p{syntax:'<number>';inherits:true;initial-value:0}
@property --ang{syntax:'<angle>';inherits:false;initial-value:0deg}
:root{--chrome:linear-gradient(145deg,rgba(255,255,255,.34),rgba(255,255,255,.05) 38%,rgba(255,255,255,.14) 70%,rgba(255,255,255,.04))}
/* titanium edge on glass: bevelled gradient border */
.card,.kpi div,button.codetile,.cat{position:relative;border:1px solid transparent;
 background:linear-gradient(180deg,rgba(30,38,50,.82),rgba(17,22,30,.78)) padding-box,var(--chrome) border-box}
.cat.on{background:linear-gradient(180deg,rgba(92,200,255,.26),rgba(92,200,255,.07)) padding-box,linear-gradient(145deg,rgba(150,225,255,.95),rgba(92,200,255,.3)) border-box}
.card::after,.kpi div::after,button.codetile::after,.cat::after,.hero::after{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;opacity:0;transition:opacity .3s;
 background:radial-gradient(280px circle at var(--mx,50%) var(--my,-30%),rgba(160,225,255,.13),transparent 62%)}
@media (hover:hover){.card:hover::after,.kpi div:hover::after,button.codetile:hover::after,.cat:hover::after,.hero:hover::after{opacity:1}}

function pushAll(){

  try{do{again=false;

    if(!cfgDirty&&!hasPending())break;
    setSync('busy');
    if(cfgDirty){const s=JSON.stringify(db.cfg);const{error}=await sb.from('app_config').upsert({id:1,data:db.cfg});if(error)throw error;CFGSNAP=s}
    for(const k of TBL){for(const c of db[k].slice()){
     const body=strip(c),s=JSON.stringify(body);if(SN[k][c.id]===s)continue;
     if(c._rev==null){const{data,error}=await sb.from(k).insert({id:c.id,ref:c.ref,data:body}).select('rev').single();if(error)throw error;c._rev=data.rev}
     else{const{data,error}=await sb.from(k).update({data:body}).eq('id',c.id).eq('rev',c._rev).select('rev');if(error)throw error;if(!data.length){await conflict(k,c);continue}c._rev=data[0].rev}
     SN[k][c.id]=s}}
    const un=db.audit.filter(a=>a.local);

   }while(again);
   if(!hasPending())setSync('ok')
  }catch(e){console.error(e);setSync('err')}

function startNew(pre){F=Object.assign(blankForm(),pre||{});go('new')}

 const ds=(id,k)=>`<datalist id="${id}">${[...new Set(db.complaints.map(c=>c[k]).filter(Boolean))].map(v=>`<option value="${esc(v)}">`).join('')}</datalist>`;
 return `<h2>New complaint / observation</h2>

 <div class="row"><div><label>Unit / department area</label><input list="dl_u" value="${esc(F.unit)}" oninput="F.unit=this.value;updForm()"></div><div><label>Room / corridor / exact spot</label><input value="${esc(F.room)}" oninput="F.room=this.value;updForm()"></div></div>
 ${ds('dl_b','building')}${ds('dl_f','floor')}${ds('dl_u','unit')}

 <label>Reporting person (if provided)</label><input value="${esc(F.reporter)}" oninput="F.reporter=this.value">

function updForm(){if(V.n!=='new')return;const sg=suggest(F);
 const sb=document.getElementById('sugbox'),ab=document.getElementById('alertbox'),pr=document.getElementById('prbox');
 if(sg){F._sg=sg;sb.innerHTML=`<div class="info"><b>Suggested priority: ${sg.r.toUpperCase()}</b>${sg.urgent?' · <b>potentially urgent</b>':''}<br><span class="mut">${sg.why.map(esc).join(' · ')}</span><br><span class="mut">Consider location, operational impact and available alternative protection before confirming.</span></div>`}
 else{sb.innerHTML='';F._sg=null}
 const crit=(F.priority==='critical')||(sg&&(sg.r==='critical'||sg.urgent));
 ab.innerHTML=crit?`<div class="alert">🚨 ${esc(emergencyText)}</div>`:'';
 pr.innerHTML=`<div class="row">${PR.map(p=>`<button class="${F.priority===p?p:'sec'}" onclick="F.priority='${p}';updForm()">${p.toUpperCase()}${sg&&sg.r===p?' ★':''}</button>`).join('')}</div>`+(sg?`<div class="mut" style="margin-top:6px">★ = suggested.</div>`:'');
 const sim=document.getElementById('similar');
 if(F.cat&&F.sub){const m=similarTo(F);F.similar=F.similar.filter(x=>m.some(c=>c.id===x));
  sim.innerHTML=m.length?`<div class="warn"><b>Similar previous complaints (${m.length})</b> - tick to link as repeat:${m.slice(0,6).map(c=>`<div><label style="display:flex;gap:8px;align-items:center;margin:4px 0"><input type="checkbox" style="width:auto" ${F.similar.includes(c.id)?'checked':''} onchange="togSim('${c.id}',this.checked)">${c.ref} · ${esc(loc(c))} · ${esc(c.status)} · ${fmtD(c.submittedAt)}</label></div>`).join('')}</div>`:''}
 else sim.innerHTML=''}
function togSim(id,on){F.similar=F.similar.filter(x=>x!==id);if(on)F.similar.push(id);if(F.similar.length)F.recurring='yes';updForm()}
function similarTo(f,selfId){const n=s=>(s||'').toLowerCase().trim();
 return db.complaints.filter(c=>c.id!==selfId&&c.cat===f.cat&&(c.sub===f.sub||f.cat==='other')&&(!f.building||n(c.building)===n(f.building))&&(!f.floor||n(c.floor)===n(f.floor))&&(!f.unit||n(c.unit)===n(f.unit))).sort((a,b)=>b.submittedAt.localeCompare(a.submittedAt))}
async function submitNew(){if(!F.cat||!F.sub)return alert('Select a category and subcategory.');
 if(!F.desc.trim())return alert('Enter a description.');if(F.cat==='other'&&!F.otherDesc.trim())return alert('The "Other" option requires a description of the new complaint type.');
 if(!(F.building||F.floor||F.unit||F.room))return alert('Enter at least one location detail.');
 if(!F.priority)return alert('Confirm a priority (tap the suggested one).');
 const btn=document.getElementById('savebtn');btn.disabled=true;btn.textContent='Saving…';
 let ref;try{const{data,error}=await sb.rpc('next_ref');if(error)throw error;ref=data}
 catch(e){btn.disabled=false;btn.textContent='Save complaint';return alert('Cannot reach the database to issue a unique reference number. Check the connection and try again. If this is a critical hazard, act on it now and record it afterwards.')}
 const c={id:uid(),ref,submittedAt:nowISO(),receivedAt:F.received?new Date(F.received).toISOString():nowISO(),eventAt:F.event?new Date(F.event).toISOString():'',
 reporter:F.reporter,dept:F.dept,channel:F.channel,building:F.building,floor:F.floor,unit:F.unit,room:F.room,cat:F.cat,sub:F.sub,otherDesc:F.otherDesc,desc:F.desc,original:F.original,involved:F.involved,action:F.action,recurring:F.recurring,
 links:F.similar.slice(),officer:F.officer,enteredBy:me.id,respDept:F.respDept,priority:F.priority,suggested:F._sg?F._sg.r:'',urgentFlag:!!(F._sg&&F._sg.urgent),
 classification:'Unassessed',status:'Received',corrective:'',responsible:'',workOrder:'',target:'',
 evidence:F.evidence.map(e=>Object.assign(e,{purpose:'report'})),history:[{at:nowISO(),by:me.id,from:null,to:'Received',comment:'Complaint logged via '+F.channel}],notes:[]};
 db.complaints.push(c);audit('CREATE',c.ref,catOf(c.cat).name+' / '+c.sub+' / '+c.priority);
 c.links.forEach(id=>{const o=db.complaints.find(x=>x.id===id);if(o){o.links=o.links||[];if(!o.links.includes(c.id))o.links.push(c.id);audit('LINK',o.ref,'Linked to '+c.ref)}});
 persistPending();await pushAll();
 if(dirtyC(c))alert('Saved on this device as '+ref+' but not yet synced. It will sync automatically when the connection returns - keep this page open.');
 const crit=c.priority==='critical'||c.urgentFlag;F=null;go('detail',{id:c.id,crit})}

/* ===== Evidence (private storage bucket) ===== */
const URLC=new Map();
async function signed(p){const h=URLC.get(p);if(h&&h.exp>Date.now())return h.url;
 const{data,error}=await sb.storage.from('evidence').createSignedUrl(p,3600);if(error||!data)return null;
 URLC.set(p,{url:data.signedUrl,exp:Date.now()+3300000});return data.signedUrl}
function hydrate(root){root=root||document;if(!sb)return;
 root.querySelectorAll('img[data-path]').forEach(async el=>{const u=await signed(el.dataset.path);if(u)el.src=u});
 root.querySelectorAll('a[data-dl]').forEach(async a=>{const u=await signed(a.dataset.dl);if(u){a.href=u;a.target='_blank';a.rel='noopener'}})}
async function uploadEv(dataUrl){const blob=await(await fetch(dataUrl)).blob();
 const path=new Date().getFullYear()+'/'+uid()+(blob.type==='application/pdf'?'.pdf':'.jpg');
 const{error}=await sb.storage.from('evidence').upload(path,blob,{contentType:blob.type,upsert:false});
 if(error)throw new Error('Upload failed: '+error.message);return path}
function evList(list){return list.length?list.map(e=>`<div class="card" style="padding:8px">${e.kind==='image'?`<img class="th" data-path="${esc(e.path)}" alt="evidence">`:''}${e.kind==='file'?`<a href="#" data-dl="${esc(e.path)}">📄 ${esc(e.name)}</a>`:''}${e.text?`<div style="white-space:pre-wrap;font-size:13px">${esc(e.text)}</div>`:''}
 <div class="mut">${esc(e.name||'Text evidence')} · ${esc(e.purpose||'')} · ${esc(uname(e.by))} · ${fmt(e.at)}${e.note?' · '+esc(e.note):''}</div></div>`).join(''):'<div class="mut">No evidence attached.</div>'}
function compress(file){return new Promise((res,rej)=>{const r=new FileReader();r.onerror=()=>rej('Could not read the file.');r.onload=()=>{
 if(!file.type.startsWith('image/')){if(file.type!=='application/pdf')return rej('Only photos/screenshots and PDF files are permitted.');if(file.size>4194304)return rej('PDF must be under 4 MB.');return res({kind:'file',data:r.result})}
 const im=new Image();im.onload=()=>{const s=Math.min(1,1280/Math.max(im.width,im.height)),cv=document.createElement('canvas');cv.width=im.width*s;cv.height=im.height*s;cv.getContext('2d').drawImage(im,0,0,cv.width,cv.height);res({kind:'image',data:cv.toDataURL('image/jpeg',.72)})};im.onerror=()=>rej('Could not read the image.');im.src=r.result};r.readAsDataURL(file)})}
function modal(html){document.getElementById('modal').innerHTML=html?`<div class="ov" onclick="if(event.target===this)modal('')"><div class="box" role="dialog" aria-modal="true">${html}</div></div>`:''}
function addEvidenceUI(cid,purpose){modal(`<h2>Add file evidence</h2><label>File (photo, screenshot, PDF)</label><input type="file" id="ef" accept="image/*,application/pdf">
 <label>Note (optional)</label><input id="en">${cid?`<label>Purpose</label><select id="ep"><option value="investigation" ${purpose==='investigation'?'selected':''}>Investigation</option><option value="closure" ${purpose==='closure'?'selected':''}>Closure / completion evidence</option><option value="report">Original report</option></select>`:''}
 <p><button id="evbtn" onclick="doAddEv('${cid||''}')">Add</button> <button class="sec" onclick="modal('')">Cancel</button></p>`)}
async function doAddEv(cid){const f=ef.files[0];if(!f)return alert('Choose a file.');const b=document.getElementById('evbtn');b.disabled=true;b.textContent='Uploading…';
 try{const x=await compress(f);const path=await uploadEv(x.data);
  pushEv(cid,{id:uid(),kind:x.kind,path,name:f.name,note:en.value,by:me.id,at:nowISO(),purpose:cid?ep.value:'report'})}
 catch(e){b.disabled=false;b.textContent='Add';alert(e.message||e)}}
function addTextEvidenceUI(cid){modal(`<h2>Paste message / conversation text</h2><textarea id="et" style="min-height:160px" placeholder="Paste copied WhatsApp or email text (original wording is preserved)"></textarea>
 ${cid?`<label>Purpose</label><select id="ep"><option value="investigation">Investigation</option><option value="closure">Closure / completion evidence</option><option value="report">Original report</option></select>`:''}
 <p><button onclick="doAddText('${cid||''}')">Add</button> <button class="sec" onclick="modal('')">Cancel</button></p>`)}
function doAddText(cid){if(!et.value.trim())return;pushEv(cid,{id:uid(),kind:'text',text:et.value,name:'Pasted text',by:me.id,at:nowISO(),purpose:cid?ep.value:'report'})}
function pushEv(cid,ev){if(cid){const c=db.complaints.find(x=>x.id===cid);c.evidence.push(ev);audit('EVIDENCE',c.ref,ev.purpose+': '+(ev.name||ev.kind));save();modal('');render()}
 else{F.evidence.push(ev);modal('');document.getElementById('evlist').innerHTML=evList(F.evidence);hydrate()}}

 ${linked.length?`<div class="warn"><b>Linked / repeat complaints</b>${linked.map(l=>`<div class="item" onclick="go('detail',{id:'${l.id}'})">${l.ref} · ${esc(l.sub)} · ${esc(l.status)} · ${fmtD(l.submittedAt)}${l.status==='Closed'?' <span class="badge gray">closed earlier - possible ineffective corrective action</span>':''}</div>`).join('')}</div>`:''}
 ${ro?'':`<div class="card"><h3>Workflow</h3><div class="row">${NEXT[c.status].map(t=>`<button class="${t==='Closed'?'dan':''}" onclick="transUI('${c.id}','${t}')">→ ${t}</button>`).join('')}</div></div>

 <div class="row"><div><label>Responsible dept</label><select id="a_rd"><option value="">-</option>${db.cfg.depts.map(d=>`<option ${c.respDept===d?'selected':''}>${d}</option>`).join('')}</select></div><div><label>Target date</label><input type="date" id="a_td" value="${c.target||''}"></div></div>

 <div class="card"><h3>History & audit trail</h3>${[...c.history].reverse().map(h=>`<div class="hist"><b>${h.from?esc(h.from)+' → ':''}${esc(h.to)}</b><div class="mut">${fmt(h.at)} · ${esc(uname(h.by))}</div>${h.comment?`<div style="white-space:pre-wrap">${esc(h.comment)}</div>`:''}</div>`).join('')}
 ${db.audit.filter(a=>a.ref===c.ref&&a.action!=='CREATE').slice().reverse().map(a=>`<div class="mut">${fmt(a.at)} · ${esc(a.byName)} · ${esc(a.action)} ${esc(a.detail)}</div>`).join('')}</div>`}
function saveAssess(id){const c=db.complaints.find(x=>x.id===id);const ch=[];
 const set=(k,v,l)=>{if(c[k]!==v){ch.push(`${l}: ${c[k]||'-'} → ${v||'-'}`);c[k]=v}};

 r.dates=[...new Set((t.match(/\b\d{1,2}[\/\-.]\d{1,2}[\/\-.]\d{2,4}\b|\b\d{1,2}:\d{2}\s?(?:am|pm)?\b|\btoday\b|\byesterday\b|\btomorrow\b/gi)||[]))];

const toLoc=iso=>iso?localDT(new Date(iso)):'';
const durS=ms=>{if(ms==null||isNaN(ms)||ms<0)return '-';const m=Math.round(ms/60000);return m<60?m+' min':Math.floor(m/60)+' h '+(m%60)+' min'};
const incLoc=i=>[i.bldg&&'Building '+i.bldg,i.floor&&(/^\d/.test(i.floor)?'Floor '+i.floor:i.floor),i.level&&'Level '+i.level,i.area,i.room].filter(Boolean).join(', ')||'-';
const incDur=i=>i.clearedAt?durS(new Date(i.clearedAt)-new Date(i.startAt)):'-';
const incOpenStatus=s=>s==='Active'||s==='Reopened';
function newInc(code){return{id:uid(),code,status:'Active',startAt:nowISO(),clearedAt:'',bldg:'',floor:'',level:'',area:'',room:'',notifVia:'',caller:'',callerName:'',dispatched:[],
 resp:ROLES.map(r=>({role:r,att:false,name:'',emp:''})),nature:[],pipe:[],obs:[],where:[],src:[],revisits:[],
 pink:{guard:[],suspect:'',sex:'',race:'',age:'',clothing:'',head:[],armed:'',group:'',other:'',lastSeen:'',direction:'',police:'',policeAt:'',recovered:'',er:'',returned:''},
 black:{method:'',receivedBy:'',sex:'',voice:'',age:'',demeanor:'',voiceType:'',noise:[],pkgWhere:'',pkgDesc:'',evacuated:'',evacWhere:'',evacAt:'',squadAt:''},
 orange:{chemical:'',qty:'',sdsAvail:'',sdsUsed:''},generic:{affected:'',actions:''},
 narrative:'',risk:{level:'',text:''},immediate:'',longterm:'',evidence:[],history:[],enteredBy:me.id,officer:me.id}}
function incDraft(){try{if(I&&I._rev==null&&!db.incidents.some(x=>x.id===I.id))localStorage.setItem(DRAFT,JSON.stringify(Object.assign({},I,{_u:me.id})))}catch(e){}}
function toast(m){const t=document.createElement('div');t.className='toast';t.textContent=m;document.body.appendChild(t);setTimeout(()=>t.remove(),2600)}

/* ---- lists learned from past reports ---- */
function incLists(){const names=new Set(),ids=new Set(),areas=new Set(),rooms=new Set(),chem=new Set();
 db.incidents.forEach(x=>{(x.resp||[]).forEach(r=>{if(r.name)names.add(r.name);if(r.emp)ids.add(r.emp)});if(x.callerName)names.add(x.callerName);if(x.area)areas.add(x.area);if(x.room)rooms.add(x.room);if(x.orange&&x.orange.chemical)chem.add(x.orange.chemical)});
 const dl=(id,s)=>`<datalist id="${id}">${[...s].sort().map(v=>`<option value="${esc(v)}">`).join('')}</datalist>`;
 return dl('dl_names',names)+dl('dl_ids',ids)+dl('dl_areas',areas)+dl('dl_rooms',rooms)+dl('dl_chem',chem)}
function nameMap(){const m={};db.incidents.forEach(x=>(x.resp||[]).forEach(r=>{if(r.name&&r.emp)m[r.name.toLowerCase()]=r.emp}));return m}

/* ---- Codes landing page: activate, registry, dashboard ---- */
function incActiveBanner(){const a=db.incidents.filter(x=>incOpenStatus(x.status));if(!a.length)return '';
 return `<div class="alert">${a.map(x=>`<div class="actrow">${sqHTML(codeOf(x.code),'lg')}<span>${codeOf(x.code).n} active at ${esc(incLoc(x))} since ${fmt(x.startAt)}</span><button class="sm" onclick="incOpen('${x.id}')">Open report</button></div>`).join('')}</div>`}
function codesView(){const draft=(()=>{try{const d=JSON.parse(localStorage.getItem(DRAFT)||'null');return d&&d._u===me.id?d:null}catch(e){return null}})();
 const L=db.incidents.filter(i=>(!INCF.code||i.code===INCF.code)&&(!INCF.q||(i.ref+' '+incLoc(i)+' '+i.narrative).toLowerCase().includes(INCF.q.toLowerCase()))).sort((a,b)=>b.startAt.localeCompare(a.startAt));
 return `<h2>Emergency codes</h2>
 ${INC_OK?'':'<div class="warn"><b>Emergency code reports are not enabled in the database yet.</b> Run the phase 2 SQL script in Supabase (SQL Editor), then reload this page.</div>'}
 ${draft?`<div class="warn">An unsaved ${codeOf(draft.code).n} report from ${fmt(draft.startAt)} is waiting on this device.<div class="row" style="margin-top:8px"><button class="sm" onclick="incResume()">Resume report</button><button class="sec sm" onclick="if(confirm('Discard this unsaved report?')){localStorage.removeItem(DRAFT);render()}">Discard</button></div></div>`:''}
 ${can()&&INC_OK?`<div class="card"><h3>Activate a code - tap the color. The start time is recorded now.</h3><div class="codegrid">${CODES.map(c=>`<button type="button" class="codetile" style="--cc:${c.bg||c.c}" onclick="incStart('${c.id}')"><b>${c.n}</b><span>${c.t}</span></button>`).join('')}</div></div>`:''}
 <div class="row noprint" style="margin-bottom:10px"><button class="${INCTAB==='reg'?'':'sec'}" onclick="INCTAB='reg';render()">Registry</button><button class="${INCTAB==='dash'?'':'sec'}" onclick="INCTAB='dash';render()">Dashboard</button></div>
 ${INCTAB==='dash'?incDash():`<div class="card"><h3>Filter by code</h3><div class="sqrow">${CODES.map(c=>`<button type="button" class="sqbtn ${INCF.code===c.id?'on':''}" title="${c.n}" aria-label="${c.n}" aria-pressed="${INCF.code===c.id}" style="--cc:${c.bg||c.c}" onclick="INCF.code=INCF.code==='${c.id}'?'':'${c.id}';render()"></button>`).join('')}</div>
 <label>Search</label><input value="${esc(INCF.q)}" onchange="INCF.q=this.value;render()" placeholder="Report number, location or text">
 <p><button class="sec sm" onclick="incCSV()">Export spreadsheet (CSV)</button></p></div>
 <div class="card"><h3>Reports (${L.length})</h3>${L.length?L.map(i=>{const c=codeOf(i.code),cls={Active:'critical',Cleared:'medium',Closed:'low',Reopened:'high'}[i.status]||'gray';
  return `<div class="item" onclick="incOpen('${i.id}')"><div class="row" style="justify-content:space-between;align-items:center"><b>${sqHTML(c)} ${esc(i.ref)} · ${c.n}</b><span class="badge ${cls}">${esc(i.status)}</span></div><div class="mut">${esc(incLoc(i))} · ${fmt(i.startAt)}${i.clearedAt?' · '+incDur(i):''}</div></div>`}).join(''):'<div class="mut">No reports yet. Activate a code above to start one.</div>'}</div>`}`}
const PAL=['#5cc8ff','#8f7bff','#3ddc97','#f0b429','#ff8a3d','#ff5a5f','#b8c2ce'];
function pie(o,col){const e=Object.entries(o).sort((a,b)=>b[1]-a[1]),tot=e.reduce((s,x)=>s+x[1],0);if(!tot)return '<div class="mut">No data</div>';let a=0;
 const seg=e.map(([k,v],i)=>{const s=a/tot*360;a+=v;return `${col(k,i)} ${s}deg ${a/tot*360}deg`}).join(',');
 return `<div class="piewrap"><div class="pie" style="background:conic-gradient(${seg})" role="img" aria-label="Pie chart"></div><div class="legend">${e.map(([k,v],i)=>`<div><span class="sq sm" style="background:${col(k,i)}"></span> ${esc(k)} <b>${v}</b></div>`).join('')}</div></div>`}
function incDash(){const L=db.incidents;if(!L.length)return '<div class="card"><div class="mut">The dashboard fills in as reports are saved.</div></div>';
 const byCode={};CODES.forEach(c=>{const n=L.filter(i=>i.code===c.id).length;if(n)byCode[c.n]=n});
 const cc=k=>{const c=CODES.find(x=>x.n===k);return c.bg||c.c};
 const mon=[];for(let k=5;k>=0;k--){const d=new Date();d.setMonth(d.getMonth()-k,1);mon.push({k:d.getFullYear()+'-'+d.getMonth(),l:d.toLocaleString('en-GB',{month:'short'}),n:0})}
 L.forEach(i=>{const d=new Date(i.startAt),m=mon.find(x=>x.k===d.getFullYear()+'-'+d.getMonth());if(m)m.n++});const mx=Math.max(1,...mon.map(m=>m.n));
 const dur={};CODES.forEach(c=>{const v=L.filter(i=>i.code===c.id&&i.clearedAt).map(i=>new Date(i.clearedAt)-new Date(i.startAt));if(v.length)dur[c.n]=v.reduce((a,b)=>a+b,0)/v.length});
 const bld=countBy(L,i=>i.bldg?'Building '+i.bldg:'Not recorded');
 return `<div class="grid2"><div class="card"><h3>Reports by code</h3>${bars(byCode)}</div>
 <div class="card"><h3>Share of reports</h3>${pie(byCode,k=>cc(k))}</div>
 <div class="card"><h3>Reports per month (last 6)</h3><div class="vbars">${mon.map(m=>`<div><i style="height:${Math.max(4,m.n/mx*100)}px"></i>${m.n}<br>${m.l}</div>`).join('')}</div></div>
 <div class="card"><h3>By building</h3>${pie(bld,(k,i)=>PAL[i%PAL.length])}</div>
 <div class="card"><h3>Average time to clear</h3>${Object.keys(dur).length?Object.entries(dur).map(([k,v])=>`<div class="bar"><span>${esc(k)}</span><em>${durS(v)}</em></div>`).join(''):'<div class="mut">No cleared reports yet.</div>'}</div>
 <div class="card"><h3>Status</h3>${bars(countBy(L,i=>i.status))}</div></div>`}
function incCSV(){const q=v=>'"'+String(v==null?'':v).replace(/"/g,'""')+'"';
 const rows=db.incidents.map(i=>[i.ref,codeOf(i.code).n,codeOf(i.code).t,i.status,i.startAt,i.clearedAt,incDur(i),incLoc(i),uname(i.officer),(i.nature||[]).join('; '),i.risk&&i.risk.level,i.narrative].map(q).join(','));
 const b=new Blob(['﻿'+['Ref','Code','Type','Status','Start','Cleared','Duration','Location','Officer','Nature','Risk','Narrative'].map(q).join(',')+'\n'+rows.join('\n')],{type:'text/csv'});
 const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='Emergency_codes_'+localDT().slice(0,10)+'.csv';a.click();audit('EXPORT','','Incident CSV');save()}

/* ---- open / start / resume ---- */
function incStart(code){if(!can()||!INC_OK)return;I=newInc(code);incDraft();go('inc')}
function incResume(){try{const d=JSON.parse(localStorage.getItem(DRAFT));delete d._u;I=d;go('inc')}catch(e){alert('The saved draft could not be opened.')}}
function incOpen(id){const x=db.incidents.find(y=>y.id===id);if(!x)return;I=JSON.parse(JSON.stringify(x));go('inc')}

/* ---- editor helpers ---- */
const chip=(p,v,l)=>{const on=(pget(I,p)||[]).includes(v);return `<button type="button" class="chip ${on?'on':''}" aria-pressed="${on}" data-p="${p}" data-v="${esc(v)}" onclick="incTog(this)">${esc(l||v)}</button>`};
const rad=(p,v,l)=>{const on=pget(I,p)===v;return `<button type="button" class="chip ${on?'on':''}" aria-pressed="${on}" data-p="${p}" data-v="${esc(v)}" onclick="incRadio(this)">${esc(l||v)}</button>`};
const fld=(p,l,ph,list)=>`<label>${l}</label><input data-p="${p}" value="${esc(pget(I,p))}" ${ph?`placeholder="${esc(ph)}"`:''} ${list?`list="${list}"`:''} oninput="incSet(this)">`;
const txa=(p,l,r)=>`<label>${l}</label><textarea data-p="${p}" rows="${r||3}" oninput="incSet(this)">${esc(pget(I,p))}</textarea>`;
const chips=(p,arr,fn)=>`<div class="chips">${arr.map(v=>(fn||chip)(p,v)).join('')}</div>`;
function incRerender(){const f=document.getElementById('incform');if(!f)return;const y=window.scrollY;f.innerHTML=incFormHTML();window.scrollTo(0,y);incDraft()}
function incTog(el){const p=el.dataset.p,v=el.dataset.v,a=pget(I,p),i=a.indexOf(v);if(i<0)a.push(v);else a.splice(i,1);
 el.classList.toggle('on');el.setAttribute('aria-pressed',i<0);incDraft();if(p==='nature')incRerender()}
function incRadio(el){const p=el.dataset.p,v=el.dataset.v;pset(I,p,pget(I,p)===v?'':v);if(p==='bldg'){I.floor='';I.level=''}if(p==='floor')I.level='';incRerender()}
function incSet(el){pset(I,el.dataset.p,el.value);incDraft()}
function incTime(p,el){pset(I,p,el.value?new Date(el.value).toISOString():'');incDraft()}
function incStamp(p){pset(I,p,nowISO());incRerender()}
function incStampClr(p){pset(I,p,'');incRerender()}
function stampRow(p,l){const v=pget(I,p);return v?`<div class="stamp"><span>${l}</span><b>${fmt(v)}</b><button type="button" class="sec sm" onclick="incStampClr('${p}')">Reset</button></div>`:`<button type="button" class="sec" onclick="incStamp('${p}')">Record: ${l}</button>`}
function incResp(i){const r=I.resp[i];r.att=!r.att;incRerender()}
function incRespF(i,k,el){const r=I.resp[i];r[k]=el.value;
 if(k==='name'&&el.value){if(!r.att){r.att=true;el.parentNode.querySelector('.chip').classList.add('on')}
  const e=nameMap()[el.value.toLowerCase()];if(e&&!r.emp){r.emp=e;el.parentNode.querySelector('input[data-k=emp]').value=e}}incDraft()}
function revisitHTML(){return `<label>Revisits to check for recurrence</label><div class="revs">${[1,2].map(n=>{const r=(I.revisits||[]).find(x=>x.n===n);
 return r?`<div class="stamp"><span>Revisit ${n}</span><b>${fmt(r.at)} - ${esc(r.result)}${r.note?' ('+esc(r.note)+')':''}</b><button type="button" class="sec sm" onclick="incRevisitUI(${n})">Redo</button></div>`:`<button type="button" class="sec" onclick="incRevisitUI(${n})">Record revisit ${n}</button>`}).join('')}</div>`}
function incRevisitUI(n){modal(`<h2>Revisit ${n}</h2><div class="mut">The time is recorded when you choose a result.</div><label>Note (optional)</label><input id="rv_n"><div class="row" style="margin-top:12px"><button class="dan" onclick="incRevisit(${n},'Something observed')">Something observed</button><button onclick="incRevisit(${n},'Nothing unsafe observed')">Nothing unsafe observed</button></div><p><button class="sec" onclick="modal('')">Cancel</button></p>`)}
function incRevisit(n,res){I.revisits=(I.revisits||[]).filter(x=>x.n!==n);I.revisits.push({n,at:nowISO(),result:res,note:rv_n.value.trim()});modal('');incRerender()}
function incEvUI(){modal(`<h2>Add photo or file</h2><label>Photo, screenshot or PDF</label><input type="file" id="incf" accept="image/*,application/pdf"><label>Note (optional)</label><input id="incn"><p><button id="incevb" onclick="doIncEv()">Add</button> <button class="sec" onclick="modal('')">Cancel</button></p>`)}
async function doIncEv(){const f=incf.files[0];if(!f)return alert('Choose a file.');const b=document.getElementById('incevb');b.disabled=true;b.textContent='Uploading…';
 try{const x=await compress(f),path=await uploadEv(x.data);I.evidence.push({id:uid(),kind:x.kind,path,name:f.name,note:incn.value,by:me.id,at:nowISO(),purpose:'incident'});modal('');incRerender();hydrate()}
 catch(e){b.disabled=false;b.textContent='Add';alert(e.message||e)}}
function incSuggest(){const s=SUG[I.code];if(!s)return;if(!I.risk.level)I.risk.level=s.r;if(!I.immediate.trim())I.immediate=s.i;if(!I.longterm.trim())I.longterm=s.l;incRerender()}

/* ---- narrative and details ---- */
function incDetails(i){const J=a=>(a||[]).join('; '),o=[],P=i.pink,B=i.black,O=i.orange,G=i.generic;
 if(i.code==='red'){o.push(['Nature of emergency',J(i.nature)],['What was observed',J(i.obs)],['Where observed',J(i.where)],['Source identified',J(i.src)])}
 else if(i.code==='brown'){o.push(['Nature of failure',J(i.nature)],['Pipeline type',J(i.pipe)])}
 else if(i.code==='pink'){o.push(['Guarding and search actions completed',J(P.guard)],['Suspected abductor seen',P.suspect]);
  if(P.suspect==='Yes')o.push(['Sex',P.sex],['Ethnic race',P.race],['Estimated age',P.age],['Clothing',P.clothing],['Headwear',J(P.head)],['Armed',P.armed],['Alone or with accomplice',P.group],['Other identifying information',P.other],['Last seen location',P.lastSeen],['Direction headed',P.direction]);
  o.push(['Police contacted',P.police],['Police contacted at',P.policeAt?fmt(P.policeAt):''],['Baby recovered',P.recovered],['Sent to ER for check-up',P.er],['Returned to the parents',P.returned])}
 else if(i.code==='black'){o.push(['Threat received by',B.method],['Received by (name)',B.receivedBy],['Caller sex',B.sex],['Voice description',B.voice],['Estimated age',B.age],['Demeanor',B.demeanor],['Voice',B.voiceType],['Background noise',J(B.noise)],['Package found at',B.pkgWhere],['Package description',B.pkgDesc],['Occupants evacuated',B.evacuated],['Evacuated buildings / floors',B.evacWhere],['Evacuation time',B.evacAt?fmt(B.evacAt):''],['Bomb squad arrived',B.squadAt?fmt(B.squadAt):''])}
 else if(i.code==='orange'){o.push(['Chemical spilled',O.chemical],['Quantity',O.qty],['SDS available',O.sdsAvail],['SDS consulted before cleanup',O.sdsUsed])}
 else o.push(['Persons affected',G.affected],['Actions taken',G.actions]);
 return o.filter(r=>r[1])}
function genNarrative(i){const c=codeOf(i.code),P=[],loc=incLoc(i);
 P.push(`${c.n} (${c.t}) was activated on ${fmt(i.startAt)}${loc!=='-'?' at '+loc:''}.`);
 if(i.notifVia||i.caller)P.push(`The Safety Officer on duty was notified${i.notifVia?' by '+i.notifVia.toLowerCase():''}${i.caller?' from a '+i.caller.toLowerCase()+(i.callerName?' ('+i.callerName+')':''):''}.`);
 if(i.dispatched.length)P.push('The Safety Officer dispatched: '+i.dispatched.join(', ')+'.');
 incDetails(i).forEach(([k,v])=>P.push(k+': '+v+'.'));
 (i.revisits||[]).slice().sort((a,b)=>a.n-b.n).forEach(r=>P.push(`Revisit ${r.n} at ${fmt(r.at)}: ${r.result.toLowerCase()}${r.note?' ('+r.note+')':''}.`));
 const att=(i.resp||[]).filter(r=>r.att).map(r=>r.role.replace(/ \(.*\)/,''));if(att.length)P.push('Responders attended: '+att.join(', ')+'.');
 P.push(i.clearedAt?`The code was cleared on ${fmt(i.clearedAt)} (duration ${incDur(i)}).`:'The code has not been cleared yet.');
 return P.join(' ')}
function incGen(){I.narrative=genNarrative(I);const t=document.getElementById('incnar');if(t)t.value=I.narrative;incDraft()}

/* ---- the form ---- */
function incCodeSection(){const c=I.code;

 if(c==='brown')return `<div class="card"><h3>Utility failure details</h3><label>Nature of failure</label>${chips('nature',NAT_BROWN)}${I.nature.includes('Leak from a broken pipeline')?`<label>Pipeline type</label>${chips('pipe',PIPES)}`:''}${revisitHTML()}<div class="mut" style="margin-top:8px">More Code Brown fields will be added later.</div></div>`;
 if(c==='pink'){const P=I.pink;return `<div class="card"><h3>Code Pink details</h3><label>Actions completed</label>${chips('pink.guard',PINK_GUARD)}

  <label>Police contacted?</label><div class="chips">${rad('pink.police','Yes')}${rad('pink.police','No')}</div>${P.police==='Yes'?stampRow('pink.policeAt','Police contacted'):''}

  <div class="mut" style="margin-top:8px">Code Pink is cleared after the baby is returned to the parents.</div></div>`}
 if(c==='black'){const B=I.black,pk=B.method==='Suspicious package or baggage';return `<div class="card"><h3>Bomb threat details</h3><label>How was the threat delivered?</label><div class="chips">${['Phone call','Text message','Email','Suspicious package or baggage'].map(v=>rad('black.method',v)).join('')}</div>
  ${B.method&&!pk?fld('black.receivedBy','Received by (name)','','dl_names'):''}
  ${B.method==='Phone call'?`<label>Caller sex</label><div class="chips">${rad('black.sex','Male')}${rad('black.sex','Female')}</div>${fld('black.voice','Voice description')}<label>Estimated age</label><div class="chips">${['Under 18','18 to 30','31 to 50','Over 50'].map(v=>rad('black.age',v)).join('')}</div><label>Demeanor</label><div class="chips">${['Angry','Sad','Neutral'].map(v=>rad('black.demeanor',v)).join('')}</div><label>Voice</label><div class="chips">${rad('black.voiceType','Natural')}${rad('black.voiceType','Altered (voice-changing app)')}</div><label>Background noise</label>${chips('black.noise',['Train','Busy road','Machines','Music','Chatter','Others'])}`:''}
  ${pk?`${fld('black.pkgWhere','Where the package was found')}${fld('black.pkgDesc','Package description')}<div class="mut">Attach a photo under Evidence to share with the authorities.</div>`:''}
  <label>Were building occupants evacuated?</label><div class="chips">${rad('black.evacuated','Yes')}${rad('black.evacuated','No')}</div>${B.evacuated==='Yes'?fld('black.evacWhere','Buildings and floors evacuated')+stampRow('black.evacAt','Evacuation time'):''}

/* ---- save / clear / close / reopen ---- */
const incHist=(to,comment)=>{I.history=I.history||[];I.history.push({at:nowISO(),by:me.id,from:I.status,to,comment:comment||''})};
async function incSave(quiet){
 const idx=db.incidents.findIndex(x=>x.id===I.id);
 if(idx<0){let ref;try{const{data,error}=await sb.rpc('next_ref',{ref_kind:'EC'});if(error)throw error;ref=data}
  catch(e){alert('Cannot reach the database to issue the report number. Your entries are kept on this device. Try again when the connection returns. In a live emergency, respond first.');return false}
  I.ref=ref;I.history.push({at:nowISO(),by:me.id,from:null,to:'Active',comment:'Code activated and report opened'});db.incidents.push(JSON.parse(JSON.stringify(I)));audit('INC_CREATE',ref,codeOf(I.code).n+' / '+incLoc(I))}
 else{db.incidents[idx]=JSON.parse(JSON.stringify(I));audit('INC_UPDATE',I.ref,I.status)}
 try{localStorage.removeItem(DRAFT)}catch(e){}
 persistPending();await pushAll();
 const s=db.incidents.find(x=>x.id===I.id);if(s)I=JSON.parse(JSON.stringify(s));
 if(!quiet)toast(dirty('incidents',s)?'Saved on this device - waiting to sync':'Saved');
 if(V.n==='inc')render();return true}
async function incClear(){
 if(I.code==='pink'&&I.pink.returned!=='Yes'&&!confirm('The baby is not recorded as returned to the parents. Clear Code Pink anyway?'))return;
 if(!confirm('Record Code cleared now?'))return;
 I.clearedAt=nowISO();if(incOpenStatus(I.status)){incHist('Cleared','Code cleared');I.status='Cleared'}
 await incSave()}
async function incClose(){const m=[];if(!I.clearedAt)m.push('Code cleared time');if(!I.bldg||!I.floor)m.push('building and floor');if(!I.risk.level)m.push('risk level');if(!I.immediate.trim())m.push('immediate action plan');
 if(m.length)return alert('Before closing, complete: '+m.join(', ')+'.');
 if(!I.narrative.trim())I.narrative=genNarrative(I);
 if(!confirm('Close this report? It will be locked.'))return;
 incHist('Closed','Report completed and closed');I.status='Closed';await incSave()}
async function incReopen(){const why=prompt('Reason for reopening this report:');if(!why)return;incHist('Reopened',why);I.status='Reopened';await incSave()}

 [/^(\d+) min$/,m=>m[1]+' دقيقة'],[/^(\d+) h (\d+) min$/,m=>m[1]+' س '+m[2]+' د'],[/^([\d.]+) h$/,m=>m[1]+' ساعة'],[/^([\d.]+) d$/,m=>m[1]+' يوم'],
 [/^(\d+)× ?$/,m=>m[1]+'×'],[/^(\d+) emergency code\(s\) active now$/,m=>m[1]+' رمز طوارئ نشط الآن'],[/^(\d+) critical\/high item\(s\) unresolved or overdue$/,m=>m[1]+' بند حرج/عالٍ غير محلول أو متأخر'],

function tr1(t){if(AR[t])return AR[t];
 if(t.endsWith(':')&&AR[t.slice(0,-1)])return AR[t.slice(0,-1)]+':';
 for(const [re,f] of PAT){const m=t.match(re);if(m)return f(m)}
 for(const p of PREFIX){if(t.length>p.length&&t.startsWith(p)){const rest=t.slice(p.length);if(/ $/.test(p)&&(rest.length>40||rest.split(' ').length>3))continue;return AR[p]+tr1(rest)}}
 if(/^[A-Z][A-Z ]+$/.test(t)&&AR[t.charAt(0)+t.slice(1).toLowerCase()])return AR[t.charAt(0)+t.slice(1).toLowerCase()];
 const parts=t.split(/( · |, | \/ | → | - |: )/);
 if(parts.length>1){let ch=false;const o=parts.map((p,i)=>{if(i%2||!p)return p;const r=tr1(p);if(r!==p)ch=true;return r});if(ch)return o.join('')}
 if(MON.test(t)){MON.lastIndex=0;return t.replace(MON,x=>AR_MONTHS[x])}MON.lastIndex=0;
 return t}
function trs(s){if(LANG!=='ar'||s==null)return s;s=String(s);const t=s.trim();if(!t||!/[A-Za-z]{2}/.test(t))return s;const lead=s.slice(0,s.indexOf(t)),trail=s.slice(s.indexOf(t)+t.length);const r=tr1(t);return r===t?s:lead+r+trail}
const _alert=window.alert.bind(window),_confirm=window.confirm.bind(window);

{const _t=toast;toast=function(m){_t(trs(m))}}

/* ===== Voice typing (browser speech recognition: Arabic and English) ===== */
const SRC=window.SpeechRecognition||window.webkitSpeechRecognition;
let VL='auto';try{VL=localStorage.getItem('sc_voice_lang')||'auto'}catch(e){}
const vCode=()=>VL==='ar'?'ar-SA':VL==='en'?'en-US':(LANG==='ar'?'ar-SA':'en-US');
const vShort=()=>vCode().startsWith('ar')?'ع':'EN';
let VOICE=null;
const MIC='<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5.5 11a6.5 6.5 0 0 0 13 0M12 17.5V21"/></svg>';
function vFinish(){const V=VOICE;if(!V)return;V.active=false;VOICE=null;try{V.rec.onend=null;V.rec.stop()}catch(e){}V.btn.classList.remove('on');V.btn.setAttribute('aria-pressed','false');document.querySelectorAll('.mic-host.live').forEach(h=>h.classList.remove('live'))}
function vToggle(field,btn){if(VOICE&&VOICE.field===field){vFinish();return}vFinish();vStart(field,btn)}
function vStart(field,btn){
 if(!SRC){toast('Voice typing is not supported in this browser. Use the microphone key on your phone keyboard, or open the app in Chrome (Android) or Safari (iPhone).');return}
 const rec=new SRC();rec.lang=vCode();rec.interimResults=true;rec.maxAlternatives=1;rec.continuous=!/iPhone|iPad|iPod/.test(navigator.userAgent);
 const V={rec,field,btn,base:field.value,fin:'',active:true,restarts:0,err:''};VOICE=V;
 const join=(a,b)=>a&&b?(/\s$/.test(a)?a:a+' ')+b:(a||b);
 const put=i=>{field.value=join(V.base,join(V.fin,i));field.dispatchEvent(new Event('input',{bubbles:true}))};
 rec.onstart=()=>{btn.classList.add('on');btn.setAttribute('aria-pressed','true');btn.parentNode.classList.add('live')};
 rec.onresult=e=>{let it='';for(let i=e.resultIndex;i<e.results.length;i++){const r=e.results[i];if(r.isFinal)V.fin=join(V.fin,r[0].transcript.trim());else it+=r[0].transcript}put(it.trim())};
 rec.onerror=e=>{const c=e.error;if(c==='aborted')return;V.err=c;
  toast(c==='not-allowed'||c==='service-not-allowed'?'Allow the microphone to use voice typing.':c==='network'?'Voice typing needs an internet connection.':c==='no-speech'?'No speech heard. Try again.':'Voice typing is not available for this language on this device.')};
 rec.onend=()=>{if(VOICE===V&&V.active&&!V.err&&V.restarts<30){V.restarts++;V.base=field.value;V.fin='';try{rec.start();return}catch(x){}}if(VOICE===V)vFinish()};
 try{rec.start()}catch(e){vFinish()}}
function vChip(chip){VL=vCode().startsWith('ar')?'en':'ar';try{localStorage.setItem('sc_voice_lang',VL)}catch(e){}
 document.querySelectorAll('.mic-lang').forEach(c=>c.textContent=vShort());
 if(VOICE){const f=VOICE.field,b=VOICE.btn;vFinish();vStart(f,b)}}
function micFor(f){if(f.dataset.mic||f.closest('.noprint,.resp,#boot')||f.hasAttribute('list')||f.readOnly||f.disabled)return;
 const tag=f.tagName,ty=(f.getAttribute('type')||'text').toLowerCase();
 if(tag==='INPUT'&&ty!=='text')return;if(!f.parentNode||f.parentNode.classList.contains('mic-host'))return;
 f.dataset.mic='1';const h=document.createElement('span');h.className='mic-host'+(tag==='TEXTAREA'?' ta':'');
 f.parentNode.insertBefore(h,f);h.appendChild(f);
 const b=document.createElement('button');b.type='button';b.className='mic';b.setAttribute('aria-label',trs('Voice typing'));b.setAttribute('aria-pressed','false');b.innerHTML=MIC;b.onclick=()=>vToggle(f,b);
 const c=document.createElement('button');c.type='button';c.className='mic-lang';c.setAttribute('aria-label',trs('Dictation language'));c.textContent=vShort();c.onclick=()=>vChip(c);
 const w=document.createElement('span');w.className='mic-tools';w.appendChild(c);w.appendChild(b);h.appendChild(w)}

/* ===== DOM pass: translate, direction, mic ===== */
function trDom(root){
 if(root.nodeType===3){if(LANG==='ar'&&root.parentNode&&!/^(SCRIPT|STYLE|TEXTAREA)$/.test(root.parentNode.nodeName)&&!root.parentNode.closest('[data-nt]')){const v=trs(root.nodeValue);if(v!==root.nodeValue)root.nodeValue=v}return}
 if(root.nodeType!==1)return;
 const els=[root,...root.querySelectorAll('*')];
 for(const el of els){
  if(el.closest&&el.closest('[data-nt]'))continue;
  if(LANG==='ar'){for(const a of ['placeholder','title','aria-label','alt']){const v=el.getAttribute&&el.getAttribute(a);if(v){const r=trs(v);if(r!==v)el.setAttribute(a,r)}}}
  const n=el.nodeName;
  if(n==='TEXTAREA'||(n==='INPUT'&&/^(text|search|)$/.test(el.getAttribute('type')||''))){if(!el.hasAttribute('dir')&&el.value)el.setAttribute('dir','auto');micFor(el)}
 }
 if(LANG==='ar'){const w=document.createTreeWalker(root,4,{acceptNode:n=>{const p=n.parentNode;return p&&!/^(SCRIPT|STYLE|TEXTAREA)$/.test(p.nodeName)&&!p.closest('[data-nt]')&&/[A-Za-z]{2}/.test(n.nodeValue)?1:2}});
  const list=[];while(w.nextNode())list.push(w.currentNode);list.forEach(n=>{const v=trs(n.nodeValue);if(v!==n.nodeValue)n.nodeValue=v})}}
const _obs=new MutationObserver(ms=>{
 for(const m of ms){m.addedNodes.forEach(n=>trDom(n))}
 _obs.takeRecords();
 if(VOICE&&!document.contains(VOICE.field))vFinish()});
['app','modal'].forEach(id=>{const el=document.getElementById(id);if(el)_obs.observe(el,{childList:true,subtree:true})});

/* ===== Visual layer: status hero, clock, boot sequence, pointer light ===== */
function heroHTML(){
 const act=db.incidents.filter(x=>incOpenStatus(x.status));
 const att=db.complaints.filter(c=>isOpen(c)&&(['critical','high'].includes(c.priority)||isOverdue(c))).length;
 const st=act.length?'em':att?'at':'ok';
 const lab={em:'Emergency active',at:'Attention',ok:'Normal'}[st];
 const sub=act.length?act.length+' emergency code(s) active now':att?att+' critical/high item(s) unresolved or overdue':'No emergency code is active.';
 const days=[],t0=new Date();t0.setHours(0,0,0,0);for(let i=13;i>=0;i--)days.push(new Date(t0.getTime()-i*864e5));
 const cnt=days.map(d=>db.complaints.filter(c=>{const t=new Date(c.submittedAt).getTime();return t>=d.getTime()&&t<d.getTime()+864e5}).length);
 const mx=Math.max(1,...cnt),W=240,H=56,pts=cnt.map((v,i)=>[i*(W/13),H-4-(v/mx)*(H-12)]);
 const line=pts.map((p,i)=>(i?'L':'M')+p[0].toFixed(1)+' '+p[1].toFixed(1)).join(' ');
 const last=pts[pts.length-1];
 return `<section class="hero ${st}" aria-label="Safety status">
 <div class="beacon"><svg viewBox="0 0 120 120" aria-hidden="true"><circle class="b1" cx="60" cy="60" r="54"/><circle class="b2" cx="60" cy="60" r="42"/><g class="sweep"><path d="M60 60 L60 8 A52 52 0 0 1 104 34 Z" fill="url(#sg)"/></g><circle class="b3" cx="60" cy="60" r="12"/></svg><i class="core"></i></div>
 <div class="hmain"><small>Safety status</small><b class="metal">${lab}</b><span>${sub}</span></div>
 <div class="hside"><svg class="spark" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" aria-hidden="true"><defs><linearGradient id="spg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#5cc8ff" stop-opacity=".38"/><stop offset="1" stop-color="#5cc8ff" stop-opacity="0"/></linearGradient></defs><path d="${line} L${W} ${H} L0 ${H} Z" fill="url(#spg)"/><path class="sl" d="${line}" pathLength="1"/><circle cx="${last[0]}" cy="${last[1]}" r="3.4" class="sd"/></svg>
 <div class="hmeta"><span><small>Last 14 days</small> <b>${cnt.reduce((a,b)=>a+b,0)}</b></span><span class="clock"><small>Local time</small> <time id="clk"></time></span></div></div></section>`}
function tickClock(){const el=document.getElementById('clk');if(el)el.textContent=new Date().toLocaleTimeString('en-GB',{timeZone:'Asia/Riyadh',hour12:false})}
setInterval(tickClock,1000);
function bootSeq(){return new Promise(res=>{
 if(window.matchMedia&&matchMedia('(prefers-reduced-motion:reduce)').matches)return res();
 const steps=['Verifying credentials','Securing the connection','Syncing records','Loading the console'];
 const o=document.createElement('div');o.id='boot';o.setAttribute('role','status');
 o.innerHTML=`<div class="bw">${SENT}<div class="bwel">${trs('Welcome')}${LANG==='ar'?'،':','} ${esc((me&&me.name||'').split(' ')[0])}</div><ul>${steps.map((s,i)=>`<li style="--d:${(i*.34).toFixed(2)}s"><i></i>${trs(s)}</li>`).join('')}</ul><div class="bbar"><i></i></div></div>`;
 document.body.appendChild(o);let done=false;
 const end=()=>{if(done)return;done=true;o.classList.add('out');setTimeout(()=>{o.remove();res()},260)};
 o.onclick=end;setTimeout(end,1650)})}
document.addEventListener('pointermove',e=>{if(e.pointerType!=='mouse')return;const t=e.target.closest&&e.target.closest('.card,.kpi div,.codetile,.cat,.hero');if(!t)return;const r=t.getBoundingClientRect();t.style.setProperty('--mx',(e.clientX-r.left)+'px');t.style.setProperty('--my',(e.clientY-r.top)+'px')},{passive:true});

document.addEventListener('input',e=>{const t=e.target;if(t&&(t.tagName==='TEXTAREA'||(t.tagName==='INPUT'&&/^(text|search|)$/.test(t.getAttribute('type')||'')))){if(t.value)t.setAttribute('dir','auto');else t.removeAttribute('dir')}},true);

boot();
